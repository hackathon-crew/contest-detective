# Included by nginx inside its http block.
limit_req_zone $binary_remote_addr zone=contest_ask:10m rate=5r/m;

server {
    listen 80;
    server_name 43.142.60.212;
    root /srv/contest-detective/frontend/dist;
    index index.html;
    client_max_body_size 4m;

    location = /api/agent/ask {
        limit_req zone=contest_ask burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/agent/ask;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
