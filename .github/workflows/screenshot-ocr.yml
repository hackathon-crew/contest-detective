name: Screenshot OCR

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/screenshot-ocr.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/screenshot-ocr.yml'

permissions:
  contents: read

jobs:
  screenshot-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99playwright-retries >/dev/null
          npx playwright install-deps chromium
      - run: npm run test:ocr-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-ocr-evidence
          path: frontend/test-results/screenshot-ocr/
          if-no-files-found: error
