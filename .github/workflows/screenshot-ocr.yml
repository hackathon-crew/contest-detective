name: Screenshot OCR

on:
  pull_request:
    paths:
      - '.github/workflows/screenshot-ocr.yml'
      - 'frontend/scripts/test-screenshot-browser.mjs'
      - 'frontend/scripts/prepare-ocr-assets.mjs'
      - 'frontend/public/ocr/**'
      - 'frontend/tests/fixtures/**'
      - 'frontend/src/features/appearance/**'
      - 'frontend/src/features/auth/auth-controls.tsx'
      - 'frontend/src/features/auth/auth-controls.css'
      - 'frontend/src/features/detective/**'
      - 'frontend/src/features/profile-match/**'
      - 'frontend/src/pages/detective/**'
      - 'frontend/src/entities/contest/**'
      - 'frontend/src/entities/user/**'
      - 'frontend/src/shared/ui/**'
      - 'frontend/src/shared/api/**'
      - 'frontend/src/app/**'
      - 'frontend/src/index.css'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.ts'
      - 'frontend/index.html'
      - 'frontend/tsconfig*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshot-ocr.yml'
      - 'frontend/scripts/test-screenshot-browser.mjs'
      - 'frontend/scripts/prepare-ocr-assets.mjs'
      - 'frontend/public/ocr/**'
      - 'frontend/tests/fixtures/**'
      - 'frontend/src/features/appearance/**'
      - 'frontend/src/features/auth/auth-controls.tsx'
      - 'frontend/src/features/auth/auth-controls.css'
      - 'frontend/src/features/detective/**'
      - 'frontend/src/features/profile-match/**'
      - 'frontend/src/pages/detective/**'
      - 'frontend/src/entities/contest/**'
      - 'frontend/src/entities/user/**'
      - 'frontend/src/shared/ui/**'
      - 'frontend/src/shared/api/**'
      - 'frontend/src/app/**'
      - 'frontend/src/index.css'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.ts'
      - 'frontend/index.html'
      - 'frontend/tsconfig*.json'

permissions:
  contents: read

jobs:
  screenshot-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ocr-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-ocr-evidence
          path: frontend/test-results/screenshot-ocr/
          if-no-files-found: error
