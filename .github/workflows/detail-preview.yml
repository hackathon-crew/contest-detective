name: Contest Detail Preview

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/detail-preview.yml'

permissions:
  contents: read

concurrency:
  group: contest-detail-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Real Chromium screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99playwright-retries >/dev/null
          npx playwright install-deps chromium
      - name: Install Chinese fonts
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 fonts-noto-cjk
      - name: Capture desktop and mobile previews
        run: npm run test:detail-preview
      - name: Upload screenshots first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-detail-screenshots-${{ github.run_id }}
          path: |
            frontend/artifacts/detail-preview/
            frontend/preview/detail-preview-provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload test report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-detail-playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/detail-preview/
            frontend/test-results/detail-preview/
          if-no-files-found: warn
          retention-days: 7
