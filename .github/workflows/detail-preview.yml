name: Contest Detail Preview

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/detail-preview.yml'

permissions:
  contents: read

concurrency:
  group: contest-detail-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Real Chromium screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install official Chromium and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture desktop and mobile previews
        run: npm run test:detail-preview
      - name: Upload screenshots first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-detail-screenshots-${{ github.run_id }}
          path: |
            frontend/artifacts/detail-preview/
            frontend/preview/detail-preview-provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload test report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-detail-playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/detail-preview/
            frontend/test-results/detail-preview/
          if-no-files-found: warn
          retention-days: 7
