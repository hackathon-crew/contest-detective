name: Documentation
description: 新增、更正或重写用户文档与协作规范。
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: 哪份文档缺了、错了或过时了，读者因此遇到什么问题。
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 改完之后文档要讲清什么。
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 这次明确不改的部分。
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 怎样算完成。
    validations:
      required: true
