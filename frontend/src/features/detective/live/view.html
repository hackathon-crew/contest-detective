<div id="stage" aria-label="Inkpaw 的侦探八爪鱼"></div>

<header class="top">
  <a class="logo" href="/detective" title="回到文字对话"
    ><img src="/inkpaw-mark-56.png" alt="" /><span>Inkpaw</span></a
  >
  <nav class="nav" aria-label="Live">
    <a href="/detective">文字对话</a>
    <button type="button" id="b-log" aria-expanded="false">记录</button>
    <button type="button" id="b-album">卡册<b id="count" hidden>0</b></button>
    <button type="button" id="b-sound" class="opt" aria-pressed="false">声音关</button>
    <button type="button" id="b-theme" class="opt">深色</button>
  </nav>
</header>

<ol id="trail" aria-hidden="true"></ol>

<div id="bubble" class="pf" role="button" tabindex="0" aria-label="点一下看完这句">
  <span class="in"><p id="btext"></p></span><span id="more"></span
  ><svg id="tail" viewBox="0 0 7 5" aria-hidden="true">
    <path class="a" d="M0 1h1v1h1v1h1v1h1v1H3V4H2V3H1V2H0zM6 1h1v1H6zM5 2h1v1H5zM4 3h1v1H4z" />
    <path class="b" d="M1 0h5v1H1zM1 1h5v1H1zM2 2h3v1H2zM3 3h1v1H3z" />
  </svg>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<div id="acts" role="group" aria-label="这张卡"></div>

<div id="dock">
  <div id="chips"></div>
  <form id="ask" class="pf" autocomplete="off">
    <label class="sr" for="q">问八爪鱼</label>
    <button type="button" id="profile-add" class="link" aria-label="添加 GitHub 或简历画像">
      +
    </button>
    <input
      id="q"
      maxlength="4000"
      enterkeyhint="send"
      placeholder="问它一场比赛，或者说说你的条件"
    />
    <span id="quota" hidden></span>
    <button id="send" class="btn primary" type="submit" aria-label="发送" disabled></button>
  </form>
</div>

<aside id="log" aria-label="对话记录">
  <div class="panel-head">
    <h2>对话记录</h2>
    <button type="button" class="link" id="log-x">收起</button>
  </div>
  <div id="loglist"></div>
</aside>

<div id="album" role="dialog" aria-modal="true" aria-label="卡册">
  <div class="sheet pf">
    <div class="panel-head">
      <h2>卡册</h2>
      <button type="button" class="link" id="album-x">关上</button>
    </div>
    <div id="grid"></div>
  </div>
</div>
