[project]
name = "contest-detective"
version = "0.1.0"
description = "比赛侦探后端：统一响应与异常处理"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
contest-detective = "contest_detective.web.bootstrap.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contest_detective"]
