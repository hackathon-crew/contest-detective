[project]
name = "contest-detective"
version = "0.1.0"
description = "比赛侦探后端：统一响应与异常处理"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "cryptography>=50.0.2",
    "dateparser>=1.2",
    "fastapi>=0.115",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "langchain-openai>=0.3",
    "lxml>=6.1.3",
    "markitdown[docx,pdf]>=0.1.4",
    "mcp>=1.30,<2",
    "openai>=3.37.0",
    "pydantic-ai-slim[openai]>=2.60.0",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.14",
    "slowapi>=0.1.10",
    "sqlalchemy>=2",
    "sse-starlette>=3.5.0",
    "tavily-python>=0.8.5",
    "tencentcloud-sdk-python-common>=3.1.193",
    "tencentcloud-sdk-python-wsa>=3.1.190",
    "trafilatura>=2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
contest-detective = "contest_detective.bootstrap.app:main"
contest-detective-sync = "contest_detective.bootstrap.source_sync:main"
contest-detective-mcp = "contest_detective.bootstrap.mcp:main"
contest-detective-refresh = "contest_detective.bootstrap.offline_refresh:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/contest_detective"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.importlinter]
root_package = "contest_detective"

[[tool.importlinter.contracts]]
name = "Domain code does not depend on HTTP"
type = "forbidden"
source_modules = ["contest_detective.contest", "contest_detective.research", "contest_detective.agent", "contest_detective.system"]
forbidden_modules = ["contest_detective.bootstrap"]

[[tool.importlinter.contracts]]
name = 'Contest owns its data'
type = "forbidden"
source_modules = ["contest_detective.contest"]
forbidden_modules = ['contest_detective.research', 'contest_detective.agent', 'contest_detective.system.auth', 'contest_detective.system.user']

[[tool.importlinter.contracts]]
name = 'Research is independent of accounts and investigation'
type = "forbidden"
source_modules = ["contest_detective.research"]
forbidden_modules = ['contest_detective.agent', 'contest_detective.system.auth', 'contest_detective.system.user']

[[tool.importlinter.contracts]]
name = 'Investigation does not authenticate'
type = "forbidden"
source_modules = ["contest_detective.agent"]
forbidden_modules = ['contest_detective.system.auth']

[[tool.importlinter.contracts]]
name = 'Ingestion does not deliver notifications'
type = 'forbidden'
source_modules = ['contest_detective.contest', 'contest_detective.research', 'contest_detective.agent']
forbidden_modules = ['contest_detective.system.notifications']
