[project]
name = "contest-detective"
version = "0.1.0"
description = "比赛侦探后端：统一响应与异常处理"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "dateparser>=1.2",
    "fastapi>=0.115",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markitdown[docx,pdf]>=0.1.4",
    "mcp>=1.30,<2",
    "openai>=3.37.0",
    "pydantic-ai-slim[openai]>=2.60.0",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.14",
    "slowapi>=0.1.10",
    "sqlalchemy>=2",
    "sse-starlette>=3.5.0",
    "trafilatura>=2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
contest-detective = "contest_detective.web.bootstrap.app:main"
contest-detective-sync = "contest_detective.web.bootstrap.source_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contest_detective"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.importlinter]
root_package = "contest_detective"

[[tool.importlinter.contracts]]
name = "Domain code does not depend on HTTP"
type = "forbidden"
source_modules = ["contest_detective.server"]
forbidden_modules = ["contest_detective.web"]

[[tool.importlinter.contracts]]
name = 'Contest owns its data'
type = "forbidden"
source_modules = ["contest_detective.server.contest"]
forbidden_modules = ['contest_detective.server.research_pipeline', 'contest_detective.server.agent', 'contest_detective.server.auth', 'contest_detective.server.user']

[[tool.importlinter.contracts]]
name = 'Research is independent of accounts and investigation'
type = "forbidden"
source_modules = ["contest_detective.server.research_pipeline"]
forbidden_modules = ['contest_detective.server.agent', 'contest_detective.server.auth', 'contest_detective.server.user']

[[tool.importlinter.contracts]]
name = 'Investigation does not authenticate'
type = "forbidden"
source_modules = ["contest_detective.server.agent"]
forbidden_modules = ['contest_detective.server.auth']
